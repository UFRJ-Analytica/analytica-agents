services:
  api:
    build: ./backend
    env_file: .env
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    environment:
      - BACKEND_PORT=${BACKEND_PORT}
      - BACKEND_HOST=${BACKEND_HOST}
      - DATA_BACKEND=${DATA_BACKEND}
      - DATA_URI=${DATA_URI}
      - DATA_FORMAT=${DATA_FORMAT}
      - AWS_REGION=${AWS_REGION}
      - AWS_S3_ENDPOINT=${AWS_S3_ENDPOINT}


  backend:
    build: ./backend
    container_name: analytica-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
    env_file:
      - ./.env
    depends_on: []
  
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL}
    container_name: analytica-frontend
    env_file:
      - ./.env
      - ./frontend/.env.local
    ports:
      - "3000:3000"
    command: ["npm", "start"]
